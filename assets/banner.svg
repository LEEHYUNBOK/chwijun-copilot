<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chwijun Copilot — a job-hunting copilot for the Korean job market">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e2a3f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97757"/>
      <stop offset="1" stop-color="#f0b429"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accent)"/>

  <!-- left: title block -->
  <text x="64" y="112" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif" font-size="20" fill="#d97757" font-weight="600" letter-spacing="4">취준 코파일럿</text>
  <text x="62" y="168" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="52" fill="#f8fafc" font-weight="800">Chwijun Copilot</text>
  <text x="64" y="206" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="19" fill="#94a3b8">A job-hunting copilot for the Korean job market</text>
  <text x="64" y="252" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#64748b">career wiki · fit analysis · watchlist scan · resume rules · tracking — one Claude Code plugin</text>

  <!-- right: terminal card -->
  <g>
    <rect x="760" y="54" width="376" height="192" rx="12" fill="#0b1120" stroke="#334155" stroke-width="1"/>
    <circle cx="786" cy="80" r="5" fill="#ef4444"/>
    <circle cx="804" cy="80" r="5" fill="#f59e0b"/>
    <circle cx="822" cy="80" r="5" fill="#22c55e"/>
    <text x="788" y="116" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#7dd3fc">$ /chwijun-copilot:job-fit &lt;url&gt;</text>
    <text x="788" y="142" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#e2e8f0">적합도 72/100 · 도전(스트레치)</text>
    <text x="788" y="166" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#94a3b8">겹치는 강점 4 · 결정적 갭 2</text>
    <text x="788" y="190" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#94a3b8">트래커 기록: 지원현황.md ✓</text>
    <text x="788" y="222" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#d97757">갭은 갭이라고 말한다 — 창작 금지</text>
  </g>
</svg>
